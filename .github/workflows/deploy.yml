name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Позволяет запустить публикацию вручную из вкладки Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация; новый пуш не отменяет уже начатую
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Тесты гоняем до публикации: опечатка в уроке не должна доехать до сайта
      - run: npm test

      - name: Build
        # GitHub Pages отдаёт проект из /<имя-репозитория>/ — передаём префикс в сборку
        env:
          PORTAL_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
